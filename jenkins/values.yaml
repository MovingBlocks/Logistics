# We use jenkins at the top level since our chart sub-charts the "jenkins" chart
jenkins:
  # Something goes funny without this even if if installed into the right namespace
  # Specifically some agent namespace settings and URLs end up reverting to "default"
  namespaceOverride: jenkins

  persistence:
    storageClass: ssd
    size: 75Gi

  # Stuff for the main server - see other values files for more specific stuff
  controller:
    image:
      repository: "jenkins/jenkins"
      tag: "2.479.2-lts"
    # The request was previously kept deliberately small, on the reasoning that a large
    # reservation on a nearly-full node blocks other pods from fitting. Measurement
    # retired that: the controller draws ~450m at p95 and ~620m at peak, so a 100m
    # request did not make it a good neighbour, it just meant the controller lost the
    # CPU share race whenever the node got busy — the same shape that took Artifactory
    # down. A request is a reservation, not a cap; under-declaring it does not free
    # capacity, it only hides who is using it.
    #
    # The LIMIT is what startup needs, and lowering it to 1500m alongside the request
    # is what put the controller into a permanent CrashLoopBackOff. Boot is a CPU burst
    # (plugin load + JCasC); the startup probe allows failureThreshold x periodSeconds,
    # and with a smaller ceiling Jenkins stopped reaching /login inside the 120s the
    # chart defaults to, so kubelet SIGTERMed it at ~115s on every attempt. Nothing else
    # about the pod changed — same image, same config checksums — so this was the whole
    # cause. Keep the ceiling high; it costs nothing while idle.
    resources:
      requests:
        cpu: "250m"
        memory: "4Gi"
      limits:
        cpu: "2000m"
        memory: "8Gi"
    probes:
      # 600s, against a measured cold boot of ~270s on a quiet node (12:45:5x start,
      # "Jenkins is fully up and running" at 12:50:20 — JCasC's PodTemplate walk is the
      # long pole). The chart's default of 120s cannot fit that at all; 300s fit it with
      # only 10% to spare, which is not margin on a node where a Terasology engine build
      # can turn up mid-boot and take the CPU this controller is no longer reserving.
      #
      # A large window costs nothing on a healthy start — the probe passes the moment
      # /login returns 200 — so the only thing it buys is not mistaking a slow start for
      # a failed one. Getting that wrong is expensive: a controller that never becomes
      # Ready also deadlocks the StatefulSet rollout that would fix it, because the
      # controller will not replace a pod it has never seen Ready.
      startupProbe:
        failureThreshold: 60

      # Liveness and readiness both get a 60s timeout, and periodSeconds must move with
      # it: leaving the chart's 10s period against a 60s timeout would let six probe
      # requests stack up concurrently, all waiting on the one component that is already
      # too busy to answer. The probe would then be adding load precisely when the
      # controller is least able to take it.
      #
      # Readiness is the one that actually cost us a build. A failed readiness check
      # removes the pod from the Service endpoints, and agents connect over websocket
      # through that Service — so a controller that is merely *busy* gets cut off from
      # every live agent mid-build, surfacing as "Connection was broken" and an
      # AgentOfflineException. With a single replica there is nowhere else to route
      # traffic anyway, so strict readiness buys nothing and costs whole builds.
      #
      # 60s x 5 failures = ~5 minutes unresponsive before either restarting (liveness)
      # or withdrawing endpoints (readiness). Slower to notice a genuinely wedged
      # controller; that trade is worth it when the alternative is killing running work
      # during a normal publish spike.
      livenessProbe:
        timeoutSeconds: 60
        periodSeconds: 60
        failureThreshold: 5
      readinessProbe:
        timeoutSeconds: 60
        periodSeconds: 60
        failureThreshold: 5
    JCasC:
      defaultConfig: false  # Disable the default JCasC configuration (don't want two Kubernetes clouds) - replacement config in values-jcasc-general.yaml
    resourceRoot: "https://content.terasology.io/"
    initScripts:
      # Security precaution - the CLI either is considered risky or we added this due to an announed vulnerability in the past and it still seems to work, maybe?
      disableCli: |-
        def removal = { lst ->
          lst.each { x -> if (x.getClass().name?.contains("CLIAction")) lst.remove(x) }
        }
        def j = jenkins.model.Jenkins.get();
        removal(j.getExtensionList(hudson.cli.CLIAction.class))
        removal(j.getExtensionList(hudson.ExtensionPoint.class))
        removal(j.getExtensionList(hudson.model.Action.class))
        removal(j.getExtensionList(hudson.model.ModelObject.class))
        removal(j.getExtensionList(hudson.model.RootAction.class))
        removal(j.getExtensionList(hudson.model.UnprotectedRootAction.class))
        removal(j.getExtensionList(java.lang.Object.class))
        removal(j.getExtensionList(org.kohsuke.stapler.StaplerProxy.class))
        removal(j.actions)

    # Pull secrets from Kubernetes and set them as env vars on the pod for JCasC to use later
    containerEnv:
      - name: GITHUB_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: jenkins-secrets
            key: github-client-id
      - name: GITHUB_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: jenkins-secrets
            key: github-client-secret
      # The casc piece came by default, other is required to enable https://plugins.jenkins.io/permissive-script-security/
      - name: JAVA_OPTS
        value: "-Dcasc.reload.token=terajenkins-0 -Dpermissive-script-security.enabled=no_security"
    ingress:
      enabled: true
      hostName: jenkins.terasology.io
      resourceRootUrl: content.terasology.io
      tls:
      - hosts:
        - jenkins.terasology.io
        - content.terasology.io
        secretName: jenkins-tls-secret
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        kubernetes.io/tls-acme: "true"
        kubernetes.io/ingress.class: nginx
