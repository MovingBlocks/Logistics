cert-manager:
  installCRDs: true

ingress-nginx:
  controller:
    # Two replicas: at one, a restart is a total ingress outage.
    replicaCount: 2
    # Keep them on separate nodes. Without this, optimize-utilization packed both
    # onto one node alongside Jenkins and Artifactory — so the replicas competed
    # with each other, and a build spike took the ingress down anyway.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: controller
            topologyKey: kubernetes.io/hostname
    # The chart ships timeoutSeconds: 1 on both probes. Under real load the
    # controller cannot answer /healthz inside a second, so kubelet SIGTERMs it,
    # it exits 0, and restarts — repeatedly, because the load does not stop.
    # Observed 40 restarts in 20h while serving crawler traffic with 15s upstream
    # times, which took artifactory.terasology.io down with it. Same failure the
    # ArgoCD repo-server and the Jenkins controller already hit.
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 5
    # Sized from measurement: CPU just under the observed p95, memory just over
    # it. The chart's 100m default under-reserved by roughly a factor of three
    # for the busiest replica, which matters because every request into the
    # cluster passes through here.
    # Measured at 995m — a full core — while serving crawler traffic against
    # Jenkins javadoc, against a 250m request. A request is the share the
    # scheduler guarantees under contention, so under-declaring it by 4x is
    # what starves the controller until it cannot answer its own /healthz
    # inside the probe timeout. Raising the request is the fix; raising the
    # timeout only buys patience while it is being starved.
    #
    # 500m rather than the observed 995m because that load is a crawler
    # anomaly, not steady state, and 2 x 1000m would not fit a node here.
    # Revisit once javadoc is no longer served through the ingress.
    resources:
      requests:
        cpu: "500m"
        memory: "256Mi"
