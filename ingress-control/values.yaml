cert-manager:
  installCRDs: true

ingress-nginx:
  controller:
    # Two replicas because this is the single front door for every host in the
    # cluster — at one replica, a restart is a total ingress outage.
    replicaCount: 2
    # The chart ships timeoutSeconds: 1 on both probes. Under real load the
    # controller cannot answer /healthz inside a second, so kubelet SIGTERMs it,
    # it exits 0, and restarts — repeatedly, because the load does not stop.
    # Observed 40 restarts in 20h while serving crawler traffic with 15s upstream
    # times, which took artifactory.terasology.io down with it. Same failure the
    # ArgoCD repo-server and the Jenkins controller already hit.
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5
    # Sized from measurement: CPU just under the observed p95, memory just over
    # it. The chart's 100m default under-reserved by roughly a factor of three
    # for the busiest replica, which matters because every request into the
    # cluster passes through here.
    resources:
      requests:
        cpu: "250m"
        memory: "150Mi"
