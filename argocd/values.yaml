argo-cd:
  notifications:
    enabled: false

  # Probe timeouts AND resources.
  #
  # The timeouts came first: repo-server was restarting every ~35 minutes (413
  # kills in 10 days, exit 143 = SIGTERM after a failed liveness probe, not OOM).
  # The chart default gives the probe timeoutSeconds: 1, and repo-server's
  # liveness endpoint is healthz?full=true, the deep check. Under CPU contention
  # that probe misses 1s, three misses kill the container, and a sync landing in
  # that window fails with "connection refused" against repo-server:8081.
  #
  # Requests were deliberately deferred at the time, because the node these
  # shared was 97% requested and adding requests would only have parked the new
  # pods Pending. That note said requests were still the right end state and
  # needed capacity first. The pool has since grown and there is now a node with
  # room, so this is that follow-up.
  #
  # Without requests these are BestEffort, which is why raising the timeout was
  # not enough on its own: at 271 restarts and zero guaranteed share on a node
  # sitting at ~100% CPU, repo-server could not finish a `helm dependency build`
  # inside Argo's 90s exec timeout, so app comparison failed with ComparisonError
  # rather than any obvious crash.
  #
  # Sized from measurement: repo-server 56m, server 7m, application-controller
  # 64m but 1.3Gi of memory. CPU asks are modest; the controller's memory ask is
  # the load-bearing one, since it had no reservation at all against real usage.
  repoServer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5

  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5

  controller:
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi

  configs:
    cm:
      dex:
        sso:
          enabled: true
          method: dex
          name: Dex
        config: |
          connectors:
            - type: github
              id: github
              name: GitHub
              config:
                clientID: 852626461c3a70ed2070
                clientSecret: ${{ .Values.my-github-oauth-secret.data.github-oath-client-secret }}
                orgs:
                - name: CervTest
