artifactory-oss: # This is needed because we end up parenting the "artifactory-oss" chart in our Chart.yaml
    artifactory: # Which in turn parents the "artifactory" chart
      artifactory: # Which in turn has an "artifactory" section. Yay.
        resources:
          requests:
            # Sized from measurement: CPU just under the observed p95, memory just
            # over it. The old 50m request scheduled this as if it were idle while
            # it actually draws ~160m steady and ~235m at peak — a request only
            # binds under contention, so the gap stayed invisible until it wasn't.
            memory: "6.5Gi"
            cpu: "150m"
          limits:
            memory: "8Gi" # Was 7Gi, which left under 500Mi of headroom above the observed peak. Memory cannot be throttled, so a thin margin here is an OOMKill rather than a slowdown.
            cpu: "1000m" # Was 500m then 750m. JFrog's own stated minimum is 2 CPU, and a 5g-heap JVM starved of CPU cannot finish boot inside the startup probe budget. Raised again after a cold start on a contended node took ~8.5min and cycled four dependent containers; the ceiling only costs anything while it is actually being used.
        javaOpts:
          xms: "5g"
          xmx: "5g"
        persistence:
          size: 100Gi # Main filestore goes here, default was only 20 Gi
      # access and router ship failureThreshold 30 (~155s and ~160s) while the other four
      # containers get 90 (~480s). A cold boot after a node roll exceeds 155s, so access is
      # killed mid-start; the router requires jfac in its topology and follows it down, and
      # the pod can never converge. Raised to 90 to match its siblings. Blocks below are the
      # chart defaults verbatim with only failureThreshold changed.
      access:
        startupProbe:
          config: |
            exec:
              command:
                - sh
                - -c
                - curl --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:8040/access/api/v1/system/readiness
            initialDelaySeconds: 5
            failureThreshold: 90
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
      router:
        startupProbe:
          config: |
            exec:
              command:
                - sh
                - -c
                - curl -s -k --fail --max-time {{ .Values.probes.timeoutSeconds }} {{ include "artifactory.scheme" . }}://localhost:{{ .Values.router.internalPort }}/router/api/v1/system/readiness
            initialDelaySeconds: 10
            failureThreshold: 90
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
      postgresql:
        persistence:
          size: 20Gi # Default was a bizzare 200 Gi
        resources:  # Add the 'resources' section here
          requests:
            cpu: "50m"
            memory: "250Mi"
          limits:
            cpu: "250m"
            memory: "2Gi"
        postgresqlPassword: artifactoryDBpass1! # Been oddly awkward trying to hide this but the DB is internal anyway so ... maybe look at Backstage app config for a secrets-based option?
          # TODO: There is actually also the "postgresql-postgres-password" which I guess is the admin account's password, which may still cycle? Eep. `NQjjpSb5N` might have been it at some point ..
          # TODO: Needs to be moved to a secrets manager and rotated. Not a big danger, Postgres is not exposed  .. see also https://github.com/jfrog/charts/issues/859
      event:
        enabled: false
      integration:
        enabled: false
      nginx:
        enabled: false
      ingress:
        enabled: true
        defaultBackend:
          enabled: false
        hosts:
          - artifactory.terasology.io
        routerPath: /
        artifactoryPath: /
        className: ""
        annotations:
          kubernetes.io/ingress.class: "nginx"
          #cert-manager.io/cluster-issuer: letsencrypt-staging
          cert-manager.io/cluster-issuer: letsencrypt-prod
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0"
          nginx.ingress.kubernetes.io/rewrite-target: "/"
          nginx.ingress.kubernetes.io/configuration-snippet: |
            rewrite ^/(v2)/token /artifactory/api/docker/null/v2/token;
            rewrite ^/(v2)/([^\/]*)/(.*) /artifactory/api/docker/$2/$1/$3;
        tls:
        - secretName: artifactory-tls-secret
          hosts:
            - artifactory.terasology.io
