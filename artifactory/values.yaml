# ── Mandatory keys (NEW as of the 107.161.x chart — it refuses to render without them) ──
#
# 107.98.9 generated these itself on first install and stored the master key on
# the PVC at etc/security/master.key. The new chart makes both mandatory and
# will not template at all if they are unset.
#
# ⚠ THE MASTER KEY MUST BE THE EXISTING ONE. It is what Artifactory's stored
# configuration is encrypted with — repository credentials, proxy passwords,
# signing keys. Handing it a freshly generated key does not fail loudly; it
# comes up and cannot decrypt its own config. Pull the real one off the running
# PVC before this merges — see the cutover runbook in README.md.
#
# Referenced by secret name rather than inlined, so neither key is committed.
global:
  masterKeySecretName: artifactory-mandatory-keys
  joinKeySecretName: artifactory-mandatory-keys

artifactory-oss: # This is needed because we end up parenting the "artifactory-oss" chart in our Chart.yaml
    artifactory: # Which in turn parents the "artifactory" chart

      # ── Database: Mimir's shared PostgreSQL, not the bundled one ──
      #
      # The bundled chart is off. See README.md for the full reasoning; the
      # short version is that every currently-supported Artifactory release
      # bundles PostgreSQL 16 or 17 against the 15.6 that was running here, and
      # the container will not start on a PGDATA directory from an older major.
      # A dump/restore was forced either way, so it went somewhere better: the
      # shared cluster is also PostgreSQL 15 (same-major, no upgrade) and gives
      # this database pgBackRest coverage — transaction-consistent with WAL —
      # in place of a crash-consistent Velero disk snapshot.
      postgresql:
        enabled: false
      database:
        type: postgresql
        driver: org.postgresql.Driver
        # ⚠ ALL THREE must come from secrets, or none of them. `database.url` as
        # a plain value looks correct and templates cleanly, but the chart only
        # writes `db-url` into its unified secret when `database.secrets` is
        # entirely empty — while the StatefulSet references `db-url` regardless.
        # Setting just user/password here (to keep the password out of Git) left
        # every container dying on:
        #     Error: couldn't find key db-url in Secret ...-unified-secret
        # so the URL moved into its own Secret, templated in
        # templates/db-url-secret.yaml, which explains the trap in full.
        #
        # Credentials come from the Secret the DataService vends, so there is no
        # password in this repo. This is exactly the "getting secrets from
        # existing k8s secrets" the README used to say the chart could not do —
        # it can, via database.secrets, it just is not the default path.
        secrets:
          url:
            name: artifactory-db-url
            key: db-url
          user:
            name: artifactory-db-dataservice
            key: username
          password:
            name: artifactory-db-dataservice
            key: password

      artifactory: # Which in turn has an "artifactory" section. Yay.
        resources:
          requests:
            # Sized from measurement: CPU just under the observed p95, memory just
            # over it. The old 50m request scheduled this as if it were idle while
            # it actually draws ~160m steady and ~235m at peak — a request only
            # binds under contention, so the gap stayed invisible until it wasn't.
            memory: "6.5Gi"
            cpu: "150m"
          limits:
            memory: "8Gi" # Was 7Gi, which left under 500Mi of headroom above the observed peak. Memory cannot be throttled, so a thin margin here is an OOMKill rather than a slowdown.
            cpu: "1000m" # Was 500m then 750m. JFrog's own stated minimum is 2 CPU, and a 5g-heap JVM starved of CPU cannot finish boot inside the startup probe budget. Raised again after a cold start on a contended node took ~8.5min and cycled four dependent containers; the ceiling only costs anything while it is actually being used.
        javaOpts:
          xms: "5g"
          xmx: "5g"
        persistence:
          size: 100Gi # Main filestore goes here, default was only 20 Gi
        # 60 MINUTES for this one — double its siblings' 25. It is the 5g-heap
        # JVM and by a wide margin the slowest of the seven to boot here.
        #
        # Measured rather than guessed. On the 107.161.20 cutover it used the
        # full 25-minute budget, was killed, and at the moment of measurement was
        # drawing 423m CPU — about 22% of the node's 2 vCPU on its own, more than
        # the other six containers combined. It was working, not hung.
        #
        # And specifically NOT waiting on data-store work: every Artifactory
        # connection in pg_stat_activity was `idle`, with no DDL and no
        # migrations. The 7.98.9 -> 7.161.20 jump does not appear to convert
        # anything at startup, so this is plain JVM/Spring initialisation being
        # starved of CPU, not one-time upgrade cost that would disappear later.
        #
        # Which means the number does not come down on its own once the upgrade
        # settles — only more CPU per node fixes it. Revisit with the node
        # upgrade, not before.
        startupProbe:
          config: |
            httpGet:
              path: /artifactory/api/v1/system/readiness
              port: {{ .Values.artifactory.tomcat.maintenanceConnector.port }}
            initialDelaySeconds: 10
            failureThreshold: 720
            periodSeconds: 5
      # ── Startup budgets, sized for THIS hardware ──
      #
      # Every startupProbe below is the upstream default block with only
      # failureThreshold changed to 300 (300 x 5s = 25 minutes).
      #
      # That is deliberately enormous, and it is not papering over a hang. These
      # are e2-highmem-2 nodes: 2 vCPU, 1930m allocatable, and the cluster sits
      # near 94% CPU requests. Artifactory is SEVEN containers in one Pod — a Pod
      # is the unit of scheduling, so they cannot be spread — six of them
      # BestEffort, all booting JVMs at once beside a 5g-heap main process. The
      # node measured 103% CPU during the 107.161.20 cutover.
      #
      # At 90 (~7.5min) the cutover deadlocked, and the mechanism is worth
      # keeping in mind because it is self-reinforcing:
      #
      #   access boots slowly under CPU starvation
      #     -> its startupProbe budget expires and WE kill it
      #     -> metadata's internal 2m join-key wait expires, it exits
      #     -> router's liveness (5 x 10s) kills it since jfac never answers
      #     -> each restart burns more CPU on JVM startup
      #     -> access boots even slower
      #
      # Nothing there converges. The containers were being killed just short of
      # finishing, and the restarts were the thing preventing them finishing.
      #
      # A startupProbe budget is a bound on how long boot may take, NOT a
      # liveness guarantee — liveness probes stay at their defaults and take over
      # once startup succeeds, so a genuinely hung process is still restarted.
      # Spending the budget generously here costs nothing when boot is healthy.
      #
      # The real fix is more CPU per node; revisit these once that lands, because
      # a 25-minute boot budget is a symptom worth being able to lower again.
      #
      # ⚠ RE-COPY THESE FROM THE CHART ON EVERY BUMP. They are pasted upstream
      # defaults, and upstream changes them: the router probe below was an `exec`
      # curl through 107.98.9 and is an `httpGet` as of 107.161.20. Carrying the
      # old block forward would have pinned a stale probe shape — and a probe that
      # still passes while testing the wrong thing is not a failure you notice.
      access:
        startupProbe:
          config: |
            exec:
              command:
                - sh
                - -c
                - curl --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:8040/access/api/v1/system/readiness
            initialDelaySeconds: 5
            failureThreshold: 300
            periodSeconds: 5
      router:
        startupProbe:
          config: |
            httpGet:
              path: /router/api/v1/system/readiness
              port: {{ .Values.router.externalPort }}
              scheme: {{ include "artifactory.scheme" . | upper }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 300
      metadata:
        startupProbe:
          config: |
            httpGet:
              path: /api/v1/system/readiness
              port: {{ .Values.metadata.internalPort }}
            initialDelaySeconds: 30
            failureThreshold: 300
            periodSeconds: 5
      topology:
        startupProbe:
          config: |
            httpGet:
              path: /topology/api/v1/system/readiness
              port: {{ .Values.topology.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 3
            failureThreshold: 300
            periodSeconds: 5
      jfconfig:
        startupProbe:
          config: |
            httpGet:
              path: /jfconfig/api/v1/system/readiness
              port: {{ .Values.jfconfig.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 3
            failureThreshold: 300
            periodSeconds: 5
      observability:
        startupProbe:
          config: |
            exec:
              command:
                - sh
                - -c
                - curl --fail --max-time {{ .Values.probes.timeoutSeconds }} http://localhost:{{ .Values.observability.internalPort }}/api/v1/system/readiness
            initialDelaySeconds: 30
            failureThreshold: 300
            periodSeconds: 5
      # ── The two SPLIT-OUT Deployments need budgets too ──
      #
      # frontend and jfbus are not containers in the StatefulSet; 107.161.20
      # moved them into their own Deployments. The first pass at startup budgets
      # raised only the seven StatefulSet containers and missed these entirely,
      # so while the main pod reached 7/7 and served the API, both of these sat
      # in CrashLoopBackOff — 35 and 47 restarts respectively.
      #
      # Their upstream defaults are wildly optimistic for this hardware:
      #
      #   frontend  failureThreshold 90  ->  7.5 minutes
      #   jfbus     failureThreshold 12  ->  60 SECONDS
      #
      # Sixty seconds, on a cluster where the JVMs beside them take tens of
      # minutes. Their logs show them starting cleanly — frontend gets as far as
      # registering all its proxy routes — and simply being killed mid-startup.
      #
      # ⚠ frontend serves the WEB UI. Artifactory can look healthy from the API
      # side (router answers, api/system/ping returns OK, Gradle/Maven clients
      # resolve) while the UI is entirely down, because the StatefulSet's
      # readiness says nothing about these two. Do not read "7/7 Running" as
      # "Artifactory is fine".
      #
      # Raised to 300 to match their siblings. Blocks are the upstream defaults
      # verbatim with only failureThreshold changed — re-copy on every bump.
      frontend:
        startupProbe:
          config: |
            httpGet:
              path: /api/v1/system/readiness
              port: {{ .Values.frontend.internalPort }}
            initialDelaySeconds: 30
            failureThreshold: 300
            periodSeconds: 5
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
      jfbus:
        startupProbe:
          config: |
            httpGet:
              path: /{{ .Values.jfbus.apiContext }}/system/health/readiness
              port: {{ .Values.jfbus.internalRestPort }}
              scheme: HTTP
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 300
            successThreshold: 1
      event:
        enabled: false
      integration:
        enabled: false
      nginx:
        enabled: false
      ingress:
        enabled: true
        defaultBackend:
          enabled: false
        hosts:
          - artifactory.terasology.io
        routerPath: /
        artifactoryPath: /
        className: ""
        annotations:
          kubernetes.io/ingress.class: "nginx"
          #cert-manager.io/cluster-issuer: letsencrypt-staging
          cert-manager.io/cluster-issuer: letsencrypt-prod
          kubernetes.io/tls-acme: "true"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
          nginx.ingress.kubernetes.io/proxy-body-size: "0" # Was listed twice; YAML keeps the last, so this is the one that ever applied.
          nginx.ingress.kubernetes.io/rewrite-target: "/"
          nginx.ingress.kubernetes.io/configuration-snippet: |
            rewrite ^/(v2)/token /artifactory/api/docker/null/v2/token;
            rewrite ^/(v2)/([^\/]*)/(.*) /artifactory/api/docker/$2/$1/$3;
        tls:
        - secretName: artifactory-tls-secret
          hosts:
            - artifactory.terasology.io
