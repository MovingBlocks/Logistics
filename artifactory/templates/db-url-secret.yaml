# The JDBC URL for the shared cluster, as a Secret.
#
# It is not sensitive — no credentials in it — and it would be far more natural
# as the plain `database.url` value. It cannot be, because of a trap in the
# upstream chart's artifactory-unified-secret.yaml, which guards `db-url` behind
# a condition amounting to: only when `database.secrets` is empty AND the
# bundled postgresql is disabled.
#
# Set even one entry under `database.secrets` — as we must, to keep the database
# password out of Git — and that whole block is skipped, while the StatefulSet
# goes on referencing `db-url` regardless. Every container then dies with:
#
#   Error: couldn't find key db-url in Secret ...-unified-secret
#
# So the chart is all-or-nothing: supply url, user AND password via
# `database.secrets`, or supply all three as plain values. There is no supported
# middle path, and the unsupported one fails at CONTAINER START rather than at
# template time — `helm template` renders happily, because the dangling
# reference is only visible by cross-checking the rendered secretKeyRefs against
# the keys the rendered secrets actually contain. Do that check when touching
# database wiring here; a clean render is not evidence on its own.
apiVersion: v1
kind: Secret
metadata:
  name: artifactory-db-url
  labels:
    app: artifactory
type: Opaque
stringData:
  # Points at the shared cluster's pgBouncer — the endpoint the DataService
  # publishes, and the one proven to accept this user during the migration.
  db-url: "jdbc:postgresql://mimir-postgres-pgbouncer.mimir.svc.cluster.local:5432/artifactory"
