# Nexus was an experiment and is currently scaled to zero pending a decision on
# whether to keep it. The PVC and all configuration below are retained, so it can
# be brought back as it was.
#
# The replica count is NOT settable here: the nexus3 chart hardcodes `replicas: 1`
# in its Deployment template and exposes no value for it (`highAvailability.replicas`
# applies only in StatefulSet mode, i.e. `deployment: false`). Scaling is therefore
# done out-of-band and is not reverted by anything, since this chart is not one of
# the apps the Logistics ArgoCD reconciles:
#
#   kubectl scale deployment nexus-nexus3 -n nexus --replicas=0
#
nexus3:
  service:
    type: ClusterIP
    clusterIP:
    annotations: {}
    port: 8081
    additionalPorts:
    - port: 8082
      name: docker-group
      containerPort: 8082
      host: docker.terasology.io
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: "nginx"
      kubernetes.io/tls-acme: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/rewrite-target: "/"
    hosts:
    - nexus.terasology.io
    ingressClassName: nginx
    tls:
      - hosts:
          - nexus.terasology.io
          - docker.terasology.io
        secretName: nexus.terasology.io
  persistence:
    enabled: true
    size: 10Gi
