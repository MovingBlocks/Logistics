# Needed or the admin UI will hang forever complaining about mixed security modes, likely due to ingress setup details here
proxy: edge

# Sized from measurement. CPU idles near zero, so the request sits at a floor
# rather than reserving capacity that goes unused almost all the time.
#
# Steady-state usage is comfortably inside the 500m ceiling, but the JVM's warm-up
# burst has been measured above it — cold starts will be throttled and therefore
# slower. That is the accepted trade for not letting one idle service hold half a
# core; revisit the ceiling if startup ever runs into a probe deadline.
resources:
  requests:
    cpu: "25m"
    memory: "600Mi"
  limits:
    cpu: "500m"

# Define the main ingress - the admin specific one isn't required but may be a good practice for later?
ingress:
  enabled: true
  hostname: keycloak.terasology.io
  annotations:
    kubernetes.io/ingress.class: "nginx"
    #cert-manager.io/cluster-issuer: letsencrypt-staging
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - hosts:
        - keycloak.terasology.io
      secretName: keycloak-tls-secret
